version: "3.9"

services:

  mysql:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taxicap

    volumes:
      - mysql_data:/var/lib/mysql

    expose:
      - "3306"

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    expose:
      - "6379"

  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      PMA_HOST: mysql

    ports:
      - "8081:80"

  backend:

    build:
      context: ./backend

    restart: unless-stopped

    depends_on:
      - mysql
      - redis


    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taxicap
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    expose:
      - "8080"
    networks:
      - app-network

  frontend:

    build: .

    restart: unless-stopped

    depends_on:
      - backend

    expose:
      - "3000"
    networks:
      - app-network

  nginx:

    image: nginx:latest

    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs

volumes:

  mysql_data:

networks:
  app-network:
    external: true